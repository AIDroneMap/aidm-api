# Builds, tests and publishes the AIDM API images and executables.
#
# A v* tag push publishes ghcr.io/aidronemap/aidm-api:<version>, :latest,
# :<version>-gpu and :gpu, then opens a draft GitHub release with the
# executable archives for linux-x64, linux-arm64 and windows-x64, SHA256SUMS,
# and the signed release manifest (manifest.json and manifest.json.sig)
# attached. The images build on the published AIDM engine images named by
# FROM_REPO in Dockerfile and Dockerfile.gpu, so the aidm release must be
# published first.
#
# The release manifest is the file aidm-ui installs from. Every run builds it
# with scripts/release-manifest.js from the three image digests (cpu-amd64,
# cpu-arm64, gpu-amd64) and the sizes the registry reports. Only a tag push
# signs it: the sign-manifest job runs in the release environment, which
# admits only v* tags and holds the secret MANIFEST_SIGNING_KEY, and it checks
# the signature against .github/manifest-public-key.txt before anything is
# uploaded, so a wrong key fails the run. No other job names that environment.
# A dry run signs with a key made in the run instead, checks the manifest with
# aidm-ui's own verifier at a pinned commit, and uploads the manifest, its
# signature and that key's public half as the manifest-dry-run artifact.
#
# Run it by hand to test the build without publishing anything:
#   gh workflow run release.yml -f publish=false
# Publish again from an existing tag, for example after a failed run:
#   gh workflow run release.yml --ref v2.5.0 -f publish=true
# Test the build on the upstream ODX images, before the aidm release is public:
#   gh workflow run release.yml --ref <branch> -f publish=false -f base=upstream
# Run only the GPU test, on the GPU image of an earlier dry run. The digest is
# in that run's digest-gpu-amd64 artifact. Nothing else is built or checked:
#   gh workflow run release.yml --ref <branch> -f publish=false -f gpu_image=ghcr.io/aidronemap/aidm-api-ci@sha256:<digest>
#
# Every run, dry run or tag, also tests the GPU image on a real NVIDIA GPU
# (the gpu-test job), like the engine's release workflow. The GitHub runners
# have no GPU, so the build job only checks that the GPU image starts. The
# build job pushes all three images by digest (to ghcr.io/aidronemap/aidm-api-ci
# on dry runs, untagged), and gpu-test runs scripts/gpu-smoke-modal-api.py,
# which starts that exact digest on a T4 on Modal, runs a task through the
# API and checks that the engine used the GPU. Nothing is tagged unless
# gpu-test passes.
#
# gpu-test runs in the modal-gpu deployment environment, which needs:
#   secrets   MODAL_TOKEN_ID, MODAL_TOKEN_SECRET
#   variable  MODAL_ENVIRONMENT, the Modal environment to run in
# It pulls the image with this run's GITHUB_TOKEN; no registry token is
# stored anywhere. Each run costs about USD 0.50 on Modal (a T4, 4 cores and
# 16 GiB for about 30 minutes at list prices); the job log prints an estimate.

name: Release
# Empty for every other run, so GitHub keeps its default title
run-name: "${{ inputs.gpu_image && 'Release: GPU test only' || '' }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the images. Needs a tag ref. When false, build and test only.
        type: boolean
        default: false
      base:
        description: Base engine images. "upstream" builds on WebODM's ODX images, for dry runs before the aidm release is public. It never publishes.
        type: choice
        options:
          - aidm
          - upstream
        default: aidm
      gpu_image:
        description: Dry runs only. Run only the GPU test, on this GPU image from an earlier dry run (ghcr.io/aidronemap/aidm-api-ci@sha256:...). Empty runs everything.
        type: string
        default: ""

permissions:
  contents: read

# One publishing run per tag, never cancelled. A new dry run cancels an older one.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' || inputs.publish) && 'publish' || 'dry-run' }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' || inputs.publish) }}

env:
  IMAGE: ghcr.io/aidronemap/aidm-api
  # Untagged images from dry runs, for gpu-test and the dry-run manifest
  CI_IMAGE: ghcr.io/aidronemap/aidm-api-ci

jobs:
  check:
    name: Check version and base images
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      engine-ref: ${{ steps.base.outputs.engine-ref }}
      engine-version: ${{ steps.base.outputs.engine-version }}
      cpu-base: ${{ steps.base.outputs.cpu-base }}
      gpu-base: ${{ steps.base.outputs.gpu-base }}
      gpu-only: ${{ steps.gpu-only.outputs.gpu-only }}
      native-archives: ${{ steps.native.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The input is not echoed before it matches, so it cannot inject a workflow command
      - name: Check the GPU-only input
        id: gpu-only
        env:
          GPU_IMAGE_INPUT: ${{ inputs.gpu_image }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          BASE_INPUT: ${{ inputs.base }}
        run: |
          if [ -z "$GPU_IMAGE_INPUT" ]; then
            echo "gpu-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            || fail "gpu_image is for dry runs started by hand only."
          [ "$PUBLISH_INPUT" != "true" ] \
            || fail "gpu_image is for dry runs only. Run it with publish=false."
          [ "$BASE_INPUT" = "aidm" ] \
            || fail "gpu_image needs base=aidm. The GPU test helpers come from the engine release in Dockerfile."
          [[ "$GPU_IMAGE_INPUT" =~ ^ghcr\.io/aidronemap/aidm-api-ci@sha256:[0-9a-f]{64}$ ]] \
            || fail "gpu_image must be ghcr.io/aidronemap/aidm-api-ci@sha256: and 64 lowercase hex digits, from the digest-gpu-amd64 artifact of an earlier dry run."
          echo "GPU-only dry run on $GPU_IMAGE_INPUT: it builds no executables, no images and no manifest, and runs only the GPU test."
          echo "gpu-only=true" >> "$GITHUB_OUTPUT"

      - name: Read package.json and compare it with the tag
        id: version
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          version=$(jq -r .version package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must look like 1.2.3, found '$version'"
            exit 1
          fi

          publish=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$PUBLISH_INPUT" = "true" ]; then
            publish=true
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
          elif [ "$publish" = "true" ]; then
            echo "::error::Publishing needs a tag. Run: gh workflow run release.yml --ref v$version -f publish=true"
            exit 1
          fi

          echo "Version $version, publish $publish"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # Checked without logging in, so a private base image fails here too
      - name: Check that the base images are published
        id: base
        env:
          BASE_INPUT: ${{ inputs.base }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          cpu=$(sed -n 's/^ARG FROM_REPO=//p' Dockerfile)
          gpu=$(sed -n 's/^ARG FROM_REPO=//p' Dockerfile.gpu)
          engine_version="${cpu##*:}"
          engine_ref="v$engine_version"

          # WebODM's ODX images, pinned. Only for dry runs.
          if [ "$BASE_INPUT" = "upstream" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::base=upstream is for dry runs only. Run it with publish=false."
              exit 1
            fi
            cpu="webodm/odx:latest@sha256:4fdd3e36c016e3221cdb2b74dd05ed54d556e375fb1f228fabb42cad524b4ff5"
            gpu="webodm/odx:gpu@sha256:cdbf29c1e8f498f12b957ec7b686efad7db043b144e2ce445bd3bd9eac2f09c5"
            engine_ref="master"
          fi
          echo "Base images: $cpu and $gpu"

          missing() {
            echo "::error::Base image $1 is not published in ghcr.io, or is not public. Publish the aidm release first: https://github.com/AIDroneMap/aidm/releases"
            exit 1
          }
          docker buildx imagetools inspect "$cpu" > /dev/null 2>&1 || missing "$cpu"
          docker buildx imagetools inspect "$gpu" > /dev/null 2>&1 || missing "$gpu"

          platforms=$(docker buildx imagetools inspect "$cpu" --format '{{json .Manifest}}' \
            | jq -r '.manifests[]?.platform | "\(.os)/\(.architecture)"')
          for platform in linux/amd64 linux/arm64; do
            if ! grep -qx "$platform" <<< "$platforms"; then
              echo "::error::Base image $cpu has no $platform image. Publish the aidm release with both architectures first."
              exit 1
            fi
          done

          # The smoke test script comes from the aidm release the base image belongs to.
          # The release manifest names the engine version from the Dockerfile,
          # also when an upstream dry run builds on other images.
          {
            echo "engine-ref=$engine_ref"
            echo "engine-version=$engine_version"
            echo "cpu-base=$cpu"
            echo "gpu-base=$gpu"
          } >> "$GITHUB_OUTPUT"

      - name: Check for pinned Windows engine archives
        id: native
        env:
          ENGINE_VERSION: ${{ steps.base.outputs.engine-version }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, "scripts")
          from get_engine import load_pins

          version, archives = load_pins()
          if version != os.environ["ENGINE_VERSION"]:
              raise SystemExit(f"Engine sums pin {version}, but the base images use {os.environ['ENGINE_VERSION']}.")
          available = bool(archives)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"available={str(available).lower()}\n")
          if available:
              print(f"Native packages enabled: engine {version} pins both Windows archives.")
          else:
              print(f"Native packages skipped: engine {version} has no pinned Windows archives.")
          PY

      - name: Explain why the native start check is skipped
        if: steps.native.outputs.available == 'false'
        env:
          ENGINE_VERSION: ${{ steps.base.outputs.engine-version }}
        run: echo "Native package start check skipped because engine $ENGINE_VERSION has no pinned Windows archives."

  # Builds every archive once, on Linux. Does not need the base images, so it
  # runs before the aidm release is public.
  executables:
    name: Build executables
    # Skipped in a GPU-only dry run. Reads the input, not check, so it still
    # starts at once; check fails the run when the input is not valid.
    if: ${{ !inputs.gpu_image }}
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that every Bun pin names the same version
        run: scripts/check-bun-pins.sh

      # From the Bun release on GitHub, checked against scripts/bun-sha256sums.txt
      - name: Download Bun
        run: |
          for platform in linux-x64 linux-aarch64 windows-x64; do
            scripts/get-bun.sh "$platform" "$RUNNER_TEMP/bun/$platform"
          done
          echo "$RUNNER_TEMP/bun/linux-x64" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile --production

      - name: Unit tests
        run: bun test tests/unit

      # Each target uses the checked Bun binary for its platform, so Bun
      # downloads nothing while compiling
      - name: Build archives
        run: |
          scripts/package.sh --bun-binary "$RUNNER_TEMP/bun/linux-x64/bun" linux-x64 dist
          scripts/package.sh --bun-binary "$RUNNER_TEMP/bun/linux-aarch64/bun" linux-arm64 dist
          scripts/package.sh --bun-binary "$RUNNER_TEMP/bun/windows-x64/bun.exe" windows-x64 dist
          cd dist
          sha256sum aidm-api-* > SHA256SUMS
          cat SHA256SUMS

      # Each archive must hold the 7-Zip build for its own platform in
      # apps/7z/, which the executable uses before the PATH (libs/apps.js).
      # file names the format and the CPU of the binary in the archive.
      - name: Check the bundled 7-Zip in each archive
        working-directory: dist
        run: |
          version=$(jq -r .version ../package.json)
          fail() { echo "::error::$1"; exit 1; }
          check() {
            local platform="$1" binary="$2" pattern="$3"
            local name="aidm-api-$version-$platform" archive member mode type
            member="$name/apps/7z/$binary"
            if [ "$platform" = "windows-x64" ]; then
              archive="$name.zip"
              type=$(python3 -I -c 'import sys, zipfile; sys.stdout.buffer.write(zipfile.ZipFile(sys.argv[1]).read(sys.argv[2]))' \
                "$archive" "$member" | file -b -) || fail "$archive has no $member"
            else
              archive="$name.tar.gz"
              mode=$(tar -tvzf "$archive" "$member" | awk '{ print $1 }') || fail "$archive has no $member"
              [ "$mode" = "-rwxr-xr-x" ] || fail "$member in $archive is not executable: $mode"
              type=$(tar -xzOf "$archive" "$member" | file -b -)
            fi
            echo "$archive: $member: $type"
            grep -Eq "$pattern" <<< "$type" || fail "$member in $archive is not a $platform binary"
          }
          check linux-x64 7zzs '^ELF 64-bit LSB .*x86-64'
          check linux-arm64 7zzs '^ELF 64-bit LSB .*ARM aarch64'
          check windows-x64 7za.exe '^PE32\+ executable.*x86-64'

      - name: Upload archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executables
          path: dist/
          if-no-files-found: error
          retention-days: 7

  native-packages:
    name: Assemble Windows native packages
    needs: [check, executables]
    if: >-
      !cancelled()
      && needs.check.result == 'success'
      && needs.executables.result == 'success'
      && needs.check.outputs.native-archives == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: executables
          path: dist

      - name: Check executable archive checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Assemble native packages from pinned engine archives
        run: |
          for variant in windows-x64 windows-x64-cuda; do
            engine=$(python3 scripts/get_engine.py "$variant" "$RUNNER_TEMP/engine")
            python3 scripts/package_native.py "$variant" \
              "dist/aidm-api-$VERSION-windows-x64.zip" "$engine" dist-native
          done
          cd dist-native
          sha256sum aidm-native-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Upload native packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-packages
          path: |
            dist-native/*.tar.gz
            dist-native/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload native package descriptions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-descriptions
          path: dist-native/*.json
          if-no-files-found: error
          retention-days: 7

  native-packages-test:
    name: Start ${{ matrix.variant }} native package
    needs: [check, native-packages]
    if: >-
      !cancelled()
      && needs.check.result == 'success'
      && needs.native-packages.result == 'success'
      && needs.check.outputs.native-archives == 'true'
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [windows-x64, windows-x64-cuda]
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.check.outputs.version }}
      ENGINE_VERSION: ${{ needs.check.outputs.engine-version }}
      VARIANT: ${{ matrix.variant }}
      ENGINE_FAILURE_LINE: ""
    steps:
      - name: Download native packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-packages
          path: dist-native

      - name: Check the package checksum and unpack with system tar
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "aidm-native-$env:VERSION-$env:VARIANT"
          $archive = "$name.tar.gz"
          $pattern = '^([a-f0-9]{64})  ' + [regex]::Escape($archive) + '$'
          $rows = @(Get-Content dist-native/SHA256SUMS | Where-Object { $_ -match $pattern })
          if ($rows.Count -ne 1) { throw "Expected one checksum for $archive." }
          $expected = [regex]::Match($rows[0], $pattern).Groups[1].Value
          $actual = (Get-FileHash "dist-native/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "SHA-256 mismatch for $archive." }
          $destination = Join-Path $env:RUNNER_TEMP native-start
          New-Item -ItemType Directory -Path $destination | Out-Null
          & "$env:SystemRoot/System32/tar.exe" -xzf "dist-native/$archive" -C $destination
          if ($LASTEXITCODE -ne 0) { throw "Cannot unpack $archive." }
          $app = Join-Path $destination $name
          if (!(Test-Path "$app/aidm-api.exe") -or !(Test-Path "$app/engine/run.bat")) {
            throw 'The native package is missing the API or the engine entry point.'
          }
          "NATIVE_APP=$app" >> $env:GITHUB_ENV

      - name: Start the package, reject one image, and stop the process tree
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP native-start-logs
          New-Item -ItemType Directory -Path $logs | Out-Null
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $token = [guid]::NewGuid().ToString('N')
          $config = Join-Path $env:RUNNER_TEMP native-start-config.json
          @{
            port = $port
            token = $token
            host = '127.0.0.1'
            parallelQueueProcessing = 1
            odx_path = Join-Path $env:NATIVE_APP engine
          } | ConvertTo-Json | Set-Content $config -Encoding utf8
          $base = "http://127.0.0.1:$port"
          $api = $null
          $tracked = [System.Collections.Generic.HashSet[int]]::new()
          function Track-ProcessTree {
            $processes = @(Get-CimInstance Win32_Process)
            do {
              $added = $false
              foreach ($process in $processes) {
                if ($tracked.Contains([int]$process.ParentProcessId)) {
                  if ($tracked.Add([int]$process.ProcessId)) { $added = $true }
                }
              }
            } while ($added)
          }
          try {
            $api = Start-Process -FilePath "$env:NATIVE_APP/aidm-api.exe" `
              -ArgumentList @('--config', "`"$config`"") -WorkingDirectory $env:NATIVE_APP `
              -RedirectStandardOutput "$logs/api-stdout.log" `
              -RedirectStandardError "$logs/api-stderr.log" -PassThru
            [void]$tracked.Add($api.Id)
            $deadline = (Get-Date).AddSeconds(120)
            $info = $null
            do {
              Track-ProcessTree
              if ($api.HasExited) { throw "The API exited with code $($api.ExitCode)." }
              try {
                $info = Invoke-RestMethod "$base/info?token=$token" -TimeoutSec 5
              } catch {
                if ((Get-Date) -ge $deadline) { throw 'The native API did not become ready.' }
                Start-Sleep -Seconds 1
              }
              if ($null -eq $info -and (Get-Date) -ge $deadline) {
                throw 'The native API returned no info before the readiness deadline.'
              }
            } while ($null -eq $info)
            $info | ConvertTo-Json -Depth 10 | Set-Content "$logs/info.log"
            if ($info.engineVersion -cne $env:ENGINE_VERSION) {
              throw "Expected engine $env:ENGINE_VERSION, got $($info.engineVersion)."
            }
            $options = Invoke-RestMethod "$base/options?token=$token" -TimeoutSec 10
            if ($options -isnot [array] -or $options.Count -eq 0) {
              throw 'The engine option list is not a non-empty array.'
            }
            $options | ConvertTo-Json -Depth 10 | Set-Content "$logs/options.log"
            Add-Type -AssemblyName System.Drawing
            $image = Join-Path $env:RUNNER_TEMP one-image.jpg
            $bitmap = [System.Drawing.Bitmap]::new(32, 32)
            try { $bitmap.Save($image, [System.Drawing.Imaging.ImageFormat]::Jpeg) }
            finally { $bitmap.Dispose() }
            $task = Invoke-RestMethod "$base/task/new?token=$token" -Method Post `
              -Form @{ images = Get-Item $image; name = 'Native package start check' } -TimeoutSec 30
            if (!$task.uuid -or $task.error) { throw "Task creation failed: $($task | ConvertTo-Json -Compress)." }
            $deadline = (Get-Date).AddSeconds(120)
            do {
              Track-ProcessTree
              if ($api.HasExited) { throw 'The API exited while the task was running.' }
              $result = Invoke-RestMethod "$base/task/$($task.uuid)/info?token=$token" -TimeoutSec 10
              if ($result.error) { throw "Cannot read task status: $($result.error)." }
              if ($result.status.code -in @(30, 40, 50)) { break }
              if ((Get-Date) -ge $deadline) { throw 'The one-image task did not finish.' }
              Start-Sleep -Seconds 1
            } while ($true)
            $result | ConvertTo-Json -Depth 10 | Set-Content "$logs/task-info.log"
            $output = Invoke-RestMethod "$base/task/$($task.uuid)/output?token=$token" -TimeoutSec 10
            $text = $output -join "`n"
            $text | Set-Content "$logs/engine-output.log"
            Write-Output $text
            if ($result.status.code -ne 30) { throw 'The engine must refuse the one-image task.' }
            if ("$($result.status.errorMessage)`n$text" -match 'Could not start process') {
              throw 'The API could not start the engine process.'
            }
            if ([string]::IsNullOrWhiteSpace($text)) { throw 'The engine wrote no task output.' }
            if ([string]::IsNullOrWhiteSpace($env:ENGINE_FAILURE_LINE)) {
              throw 'Read the engine refusal line from engine-output.log and pin ENGINE_FAILURE_LINE before accepting this check.'
            }
            if (!$text.Contains($env:ENGINE_FAILURE_LINE)) {
              throw 'The task output does not contain the recorded engine refusal line.'
            }
          } finally {
            if ($null -ne $api) {
              Track-ProcessTree
              if (!$api.HasExited) {
                & taskkill.exe /PID $api.Id /T /F
                if ($LASTEXITCODE -ne 0) { throw 'taskkill could not stop the native package.' }
              }
              $deadline = (Get-Date).AddSeconds(15)
              do {
                $remaining = @(Get-Process -Id @($tracked) -ErrorAction SilentlyContinue)
                if ($remaining.Count -eq 0) { break }
                if ((Get-Date) -ge $deadline) {
                  throw "Native package processes survived taskkill: $($remaining.Id -join ', ')."
                }
                Start-Sleep -Milliseconds 200
              } while ($true)
              "Stopped process tree: $(@($tracked) -join ', ')" | Set-Content "$logs/process-tree.log"
            }
          }

      - name: Upload native start diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-start-${{ matrix.variant }}
          path: ${{ runner.temp }}/native-start-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Runs each archive on its own platform. The runners have no engine, so the
  # executable runs in test mode. Plain --powercycle, which asks the engine for
  # its options, runs when the images are built.
  executables-test:
    name: Test ${{ matrix.platform }} executable
    needs: executables
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-26.04
            bun: linux-x64
            exe: aidm-api
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            bun: linux-aarch64
            exe: aidm-api
          - platform: windows-x64
            runner: windows-2025-vs2026
            bun: windows-x64
            exe: aidm-api.exe
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
      EXE: ${{ matrix.exe }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: executables
          path: dist

      - name: Check the archive checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Unpack (Linux)
        if: runner.os == 'Linux'
        run: tar -xzf dist/aidm-api-*-"$PLATFORM".tar.gz -C "$RUNNER_TEMP"

      - name: Unpack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path (Get-Item dist/aidm-api-*-windows-x64.zip) -DestinationPath $env:RUNNER_TEMP

      - name: Find the unpacked folder
        run: |
          temp="$RUNNER_TEMP"
          if command -v cygpath > /dev/null; then temp=$(cygpath -u "$temp"); fi
          app=$(ls -d "$temp"/aidm-api-*-"$PLATFORM")
          echo "APP=$app" >> "$GITHUB_ENV"
          ls -la "$app"

      # The images install the same tools
      - name: Install unzip and 7z (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unzip p7zip-full

      - name: Show the zip tools on the PATH
        run: |
          for tool in unzip 7z; do
            echo "$tool: $(command -v "$tool" || echo missing)"
          done

      - name: Download Bun to run the harness
        run: scripts/get-bun.sh "${{ matrix.bun }}" "$RUNNER_TEMP/bun"

      - name: Power cycle
        run: |
          cd "$APP"
          ./"$EXE" --test --powercycle

      - name: Compatibility harness
        run: |
          bun="$RUNNER_TEMP/bun/bun"
          if [ "$RUNNER_OS" = "Windows" ]; then bun="$RUNNER_TEMP/bun/bun.exe"; fi
          "$bun" tests/compat/run.js --app "$APP" -- "./$EXE"

      # The x64 executables must run on CPUs without AVX (SSE4.2, Nehalem).
      # QEMU emulates such a CPU and stops on any AVX instruction, so a Bun
      # update that raises the floor fails here.
      # QEMU runs the executable on the system glibc. Ubuntu 26.04 runners
      # install the amd64v3 variant, built for AVX2 CPUs, which crashes under
      # QEMU on its own (#28). So the step runs in a plain amd64 Ubuntu
      # container. The harness copies the app for each scenario, so both
      # mounts are read-only.
      - name: Compatibility harness on an emulated CPU without AVX (Linux x64)
        if: matrix.platform == 'linux-x64'
        env:
          BASELINE_IMAGE: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$APP:/app:ro" -v "$RUNNER_TEMP/bun:/bun:ro" \
            -w /src "$BASELINE_IMAGE" bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq qemu-user unzip p7zip-full > /dev/null
              qemu-x86_64 --version | head -n 1
              /bun/bun tests/compat/run.js --app /app -- "$(command -v qemu-x86_64)" -cpu Nehalem ./aidm-api
            '

      # The bundled 7-Zip alone: no unzip and no 7z on the PATH, so the
      # executable can only use apps/7z/. On Linux the PATH is one empty
      # folder, as in the harness's own zip-input-no-tools scenario. On
      # Windows it holds only the system folders, because the runner has
      # Git's unzip and Chocolatey's 7z. zip-input runs on every platform,
      # Windows included; zip-input-no-tools is skipped, because the app has
      # a tool. The harness itself only needs the absolute path to Bun. The
      # step fails if the harness found any tool but the bundled one, or did
      # not run zip-input.
      - name: Compatibility harness with the bundled 7-Zip alone
        run: |
          bun="$RUNNER_TEMP/bun/bun"
          tools_path="$RUNNER_TEMP/empty"
          mkdir -p "$tools_path"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bun="$RUNNER_TEMP/bun/bun.exe"
            tools_path="/c/Windows/system32:/c/Windows"
          fi
          ls -l "$APP/apps/7z"
          log="$RUNNER_TEMP/harness-bundled-7zip.log"
          PATH="$tools_path" "$bun" tests/compat/run.js --app "$APP" -- "./$EXE" | tee "$log"

          fail() { echo "::error::$1"; exit 1; }
          tr -d '\r' < "$log" > "$log.txt"
          grep -q '^Tools: unzip missing, 7z found (bundled: ' "$log.txt" \
            || fail "The harness did not find the bundled 7-Zip as the only zip tool: $(grep '^Tools: ' "$log.txt")"
          grep -q '^PASS  zip-input (' "$log.txt" || fail "zip-input did not run"
          echo "Zip tool: the bundled 7-Zip in apps/7z. zip-input ran and passed; zip-input-no-tools was skipped."

      # The same on a copy of the app without apps/, so there is no zip tool
      # at all, as on a machine where the bundled 7-Zip was deleted. The
      # harness skips zip-input and runs zip-input-no-tools: a zip task fails
      # with a clear error and the server stays up. all.zip comes from the
      # JavaScript fallback, so the harness does not compare the zip listings
      # in the other scenarios. The step fails if the harness found a zip
      # tool, or did not run zip-input-no-tools.
      - name: Compatibility harness without apps/ and without zip tools
        run: |
          bun="$RUNNER_TEMP/bun/bun"
          tools_path="$RUNNER_TEMP/empty"
          mkdir -p "$tools_path"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bun="$RUNNER_TEMP/bun/bun.exe"
            tools_path="/c/Windows/system32:/c/Windows"
          fi
          app="$RUNNER_TEMP/no-apps/$(basename "$APP")"
          mkdir -p "$RUNNER_TEMP/no-apps"
          cp -R "$APP" "$app"
          rm -rf "$app/apps"
          log="$RUNNER_TEMP/harness-no-apps.log"
          PATH="$tools_path" "$bun" tests/compat/run.js --app "$app" -- "./$EXE" | tee "$log"

          fail() { echo "::error::$1"; exit 1; }
          tr -d '\r' < "$log" > "$log.txt"
          tools=$(grep '^Tools: ' "$log.txt")
          [ "$tools" = "Tools: unzip missing, 7z missing" ] \
            || fail "The harness found a zip tool without apps/: $tools"
          grep -q '^PASS  zip-input-no-tools (' "$log.txt" || fail "zip-input-no-tools did not run"
          echo "Zip tool: none. zip-input-no-tools ran and passed; zip-input was skipped."

  build:
    name: ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.gpu-only != 'true'
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    outputs:
      gpu-image: ${{ steps.check-push.outputs.gpu-image }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu-amd64
            runner: ubuntu-26.04
            dockerfile: Dockerfile
            base: cpu
            platform: linux/amd64
            smoke: true
          - name: cpu-arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile
            base: cpu
            platform: linux/arm64
            smoke: true
          # The GPU image needs an NVIDIA GPU at run time, and GitHub runners
          # have none. So this job only builds it and checks that it starts;
          # gpu-test runs it on a real GPU on Modal.
          - name: gpu-amd64
            runner: ubuntu-26.04
            dockerfile: Dockerfile.gpu
            base: gpu
            platform: linux/amd64
            smoke: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Kept outside the workspace, so it does not end up in the build context
      # smoke-test.sh reads its config, and from engine 0.2.0 its georeferencing
      # check, from its own folder
      - name: Download the aidm smoke test
        if: matrix.smoke
        env:
          ENGINE_REF: ${{ needs.check.outputs.engine-ref }}
        run: |
          for file in smoke-test.sh smoke-test.conf; do
            url="https://raw.githubusercontent.com/AIDroneMap/aidm/$ENGINE_REF/scripts/$file"
            if ! curl -fsSL -o "$RUNNER_TEMP/$file" "$url"; then
              echo "::error::Cannot download $url. The aidm release $ENGINE_REF must include scripts/$file."
              exit 1
            fi
          done
          file=check-georeferencing.py
          if grep -qF "$file" "$RUNNER_TEMP/smoke-test.sh"; then
            url="https://raw.githubusercontent.com/AIDroneMap/aidm/$ENGINE_REF/scripts/$file"
            if ! curl -fsSL -o "$RUNNER_TEMP/$file" "$url"; then
              echo "::error::Cannot download $url. The smoke test of aidm $ENGINE_REF runs scripts/$file, so the release must include it."
              exit 1
            fi
          else
            echo "The smoke test of aidm $ENGINE_REF names no $file, so it needs no georeferencing check."
          fi
          chmod +x "$RUNNER_TEMP/smoke-test.sh"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          docker system prune -af
          df -h /

      - name: Add swap
        run: |
          swapfile=/swapfile
          if mountpoint -q /mnt; then swapfile=/mnt/swapfile; fi
          sudo swapoff -a
          sudo rm -f "$swapfile"
          sudo fallocate -l 10G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h

      # Build timestamps come from the commit, so the pushed image is the tested one
      - name: Set build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: FROM_REPO=${{ matrix.base == 'gpu' && needs.check.outputs.gpu-base || needs.check.outputs.cpu-base }}
          provenance: false
          load: true
          tags: aidm-api-smoke:${{ matrix.name }}

      - name: Smoke test
        if: matrix.smoke
        run: '"$RUNNER_TEMP/smoke-test.sh" api "aidm-api-smoke:$NAME"'
        env:
          NAME: ${{ matrix.name }}

      # Starts the API, which asks the engine for its options, then exits
      - name: Startup check
        if: ${{ !matrix.smoke }}
        run: docker run --rm "aidm-api-smoke:$NAME" --powercycle
        env:
          NAME: ${{ matrix.name }}

      # Every image is pushed on every run: the GPU image for gpu-test, all
      # three for the release manifest, which reads their digests and sizes
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the tested build, so every step comes from the build cache.
      # Dry runs push to CI_IMAGE, by digest only, so nothing is published.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: FROM_REPO=${{ matrix.base == 'gpu' && needs.check.outputs.gpu-base || needs.check.outputs.cpu-base }}
          provenance: false
          outputs: type=image,name=${{ needs.check.outputs.publish == 'true' && env.IMAGE || env.CI_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Check that the pushed image is the tested one
        id: check-push
        env:
          TESTED: ${{ steps.build.outputs.imageid }}
          PUSHED: ${{ steps.push.outputs.imageid }}
          DIGEST: ${{ steps.push.outputs.digest }}
          NAME: ${{ matrix.name }}
          PUSHED_TO: ${{ needs.check.outputs.publish == 'true' && env.IMAGE || env.CI_IMAGE }}
        run: |
          echo "Tested $TESTED, pushed $PUSHED as $PUSHED_TO@$DIGEST"
          scripts/check-pushed-image.sh "$TESTED" "$PUSHED" "$DIGEST"
          mkdir -p digests
          echo "$DIGEST" > "digests/$NAME"
          if [ "$NAME" = "gpu-amd64" ]; then
            echo "gpu-image=$PUSHED_TO@$DIGEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1

      - name: Disk usage
        if: always()
        run: df -h /

  # Runs the GPU image on a real GPU on Modal. See the comment at the top.
  # In a GPU-only dry run build is skipped, and this job runs on the gpu_image
  # input. Its helpers still come from the engine release in Dockerfile, so
  # that image should come from a dry run on the same engine.
  gpu-test:
    name: GPU test on Modal
    needs: [check, build]
    if: >-
      !cancelled()
      && needs.check.result == 'success'
      && (needs.build.result == 'success' || needs.check.outputs.gpu-only == 'true')
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: modal-gpu
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dataset, output list and engine log checks come from the engine
      # release the image is built on. gpu-smoke-modal.py reads
      # smoke-test.conf from its own folder, so both go into one folder.
      - name: Download the aidm GPU test helpers
        env:
          ENGINE_REF: ${{ needs.check.outputs.engine-ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/aidm-scripts"
          for file in gpu-smoke-modal.py smoke-test.conf; do
            url="https://raw.githubusercontent.com/AIDroneMap/aidm/$ENGINE_REF/scripts/$file"
            if ! curl -fsSL -o "$RUNNER_TEMP/aidm-scripts/$file" "$url"; then
              echo "::error::Cannot download $url. The aidm release $ENGINE_REF must include scripts/$file."
              exit 1
            fi
          done

      - name: Install the Modal client
        run: |
          python3 -m venv "$RUNNER_TEMP/modal"
          "$RUNNER_TEMP/modal/bin/pip" install --quiet modal==1.6.2

      # The Sandbox lives at most 40 minutes (SMOKE_TIMEOUT) and is not retried.
      # Builder 2025.06 adds nothing to a registry image.
      - name: Run a task through the API on a GPU
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT }}
          MODAL_IMAGE_BUILDER_VERSION: "2025.06"
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_GPU: T4
          SMOKE_TIMEOUT: "2400"
          GPU_IMAGE: ${{ needs.check.outputs.gpu-only == 'true' && inputs.gpu_image || needs.build.outputs.gpu-image }}
        run: '"$RUNNER_TEMP/modal/bin/python" scripts/gpu-smoke-modal-api.py "$RUNNER_TEMP/aidm-scripts" "$GPU_IMAGE"'

  tag-images:
    name: Tag images
    needs: [check, build, gpu-test]
    if: needs.check.outputs.publish == 'true'
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      packages: write
    outputs:
      cpu-digest: ${{ steps.tag.outputs.cpu-digest }}
      gpu-digest: ${{ steps.tag.outputs.gpu-digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifests and tags
        id: tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE@$(cat digests/cpu-amd64)" "$IMAGE@$(cat digests/cpu-arm64)"
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION-gpu" -t "$IMAGE:gpu" \
            "$IMAGE@$(cat digests/gpu-amd64)"

          cpu=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          gpu=$(docker buildx imagetools inspect "$IMAGE:$VERSION-gpu" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:$VERSION-gpu"
          echo "cpu-digest=$cpu" >> "$GITHUB_OUTPUT"
          echo "gpu-digest=$gpu" >> "$GITHUB_OUTPUT"

  # Builds the release manifest in every run. In a publish run it waits for
  # tag-images, so the digests it names are the ones the tags point at. In a
  # dry run tag-images is skipped, and a job that needs a skipped job is
  # skipped too unless its condition says otherwise; this one runs then, but
  # never after a failure or a cancel.
  manifest:
    name: Build release manifest
    needs: [check, build, gpu-test, tag-images, native-packages, native-packages-test]
    if: >-
      !cancelled()
      && needs.check.result == 'success'
      && needs.build.result == 'success'
      && needs.gpu-test.result == 'success'
      && (needs.tag-images.result == 'success'
        || (needs.tag-images.result == 'skipped' && needs.check.outputs.publish != 'true'))
      && ((needs.native-packages.result == 'success' && needs.check.outputs.native-archives == 'true')
        || (needs.native-packages.result == 'skipped' && needs.check.outputs.native-archives == 'false'))
      && ((needs.native-packages-test.result == 'success' && needs.check.outputs.native-archives == 'true')
        || (needs.native-packages-test.result == 'skipped' && needs.check.outputs.native-archives == 'false'))
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # From the Bun release on GitHub, checked against scripts/bun-sha256sums.txt
      - name: Download Bun
        run: |
          scripts/get-bun.sh linux-x64 "$RUNNER_TEMP/bun"
          echo "$RUNNER_TEMP/bun" >> "$GITHUB_PATH"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Download native package descriptions
        if: needs.check.outputs.native-archives == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-descriptions
          path: native-descriptions

      # Read only: the script reads each image manifest for its size
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build manifest.json
        shell: bash
        env:
          PUBLISH: ${{ needs.check.outputs.publish }}
          VERSION: ${{ needs.check.outputs.version }}
          ENGINE_VERSION: ${{ needs.check.outputs.engine-version }}
          NATIVE_ARCHIVES: ${{ needs.check.outputs.native-archives }}
        run: |
          image="$CI_IMAGE"
          if [ "$PUBLISH" = "true" ]; then image="$IMAGE"; fi
          native_args=()
          if [ "$NATIVE_ARCHIVES" = "true" ]; then
            native_args=(--native-descriptions native-descriptions)
          fi
          mkdir -p manifest
          bun scripts/release-manifest.js build \
            --version "$VERSION" --engine-version "$ENGINE_VERSION" \
            --image "$image" --digests digests --out manifest/manifest.json "${native_args[@]}"
          cat manifest/manifest.json

      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: manifest/manifest.json
          if-no-files-found: error
          retention-days: 7

  # Signs the manifest with the signing key. Tag pushes only: the release
  # environment admits only v* tags, so a branch run of this job would fail.
  # No other job names that environment.
  sign-manifest:
    name: Sign release manifest
    needs: manifest
    if: >-
      !cancelled()
      && needs.manifest.result == 'success'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # From the Bun release on GitHub, checked against scripts/bun-sha256sums.txt
      - name: Download Bun
        run: |
          scripts/get-bun.sh linux-x64 "$RUNNER_TEMP/bun"
          echo "$RUNNER_TEMP/bun" >> "$GITHUB_PATH"

      - name: Download manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: manifest

      # The key goes from the environment to the script's standard input. It
      # is never printed, written to a file or put on a command line.
      - name: Sign manifest.json
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          if [ -z "$MANIFEST_SIGNING_KEY" ]; then
            echo "::error::MANIFEST_SIGNING_KEY is empty. It must be set in the release environment."
            exit 1
          fi
          printenv MANIFEST_SIGNING_KEY \
            | bun scripts/release-manifest.js sign --manifest manifest/manifest.json --out manifest/manifest.json.sig

      # A wrong or rotated secret fails here, before anything is uploaded
      - name: Verify the signature with the committed public key
        run: |
          bun scripts/release-manifest.js verify --manifest manifest/manifest.json \
            --signature manifest/manifest.json.sig --public-key .github/manifest-public-key.txt

      - name: Upload signed manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-signed
          path: |
            manifest/manifest.json
            manifest/manifest.json.sig
          if-no-files-found: error
          retention-days: 7

  # Dry runs only. Signs the manifest with a key made in this run, then
  # checks it with aidm-ui's own verifier, so a manifest the UI would refuse
  # fails the dry run. The private key stays in the runner's temp folder.
  # The condition names its own status check: the implicit success() also
  # looks at tag-images, which manifest needs and a dry run skips.
  manifest-check:
    name: Check release manifest with aidm-ui
    needs: [check, manifest]
    if: >-
      !cancelled()
      && needs.check.result == 'success'
      && needs.manifest.result == 'success'
      && needs.check.outputs.publish != 'true'
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # From the Bun release on GitHub, checked against scripts/bun-sha256sums.txt
      - name: Download Bun
        run: |
          scripts/get-bun.sh linux-x64 "$RUNNER_TEMP/bun"
          echo "$RUNNER_TEMP/bun" >> "$GITHUB_PATH"

      - name: Download manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: manifest

      - name: Sign and verify with a key made in this run
        run: |
          key="$RUNNER_TEMP/dry-run-key.pem"
          openssl genpkey -algorithm ed25519 -out "$key"
          openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64 > manifest/dry-run-public-key.txt
          bun scripts/release-manifest.js sign --manifest manifest/manifest.json --out manifest/manifest.json.sig < "$key"
          bun scripts/release-manifest.js verify --manifest manifest/manifest.json \
            --signature manifest/manifest.json.sig --public-key manifest/dry-run-public-key.txt

      - name: Upload manifest, signature and public key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-dry-run
          path: |
            manifest/manifest.json
            manifest/manifest.json.sig
            manifest/dry-run-public-key.txt
          if-no-files-found: error
          retention-days: 7

      # The verifier imports only files of its own repository, so nothing is installed
      - name: Check out aidm-ui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AIDroneMap/aidm-ui
          ref: 395d6e577758e1a7528b5cf5010cdee6fc8dc26a
          path: aidm-ui
          persist-credentials: false

      - name: Verify with aidm-ui's verifyManifest
        env:
          NATIVE_ARCHIVES: ${{ needs.check.outputs.native-archives }}
        run: |
          cat > "$RUNNER_TEMP/check-manifest.ts" <<'EOF'
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";

          const { verifyManifest } = await import(resolve("aidm-ui/server/manifest/verify.ts"));
          const { signBytes } = await import(resolve("scripts/release-manifest.js"));
          const publicKey = readFileSync("manifest/dry-run-public-key.txt", "utf8").trim();
          async function checkManifest(label, bytes, signature, nativeArchives) {
            const result = await verifyManifest(bytes, signature, [{ id: "dry-run", publicKey, test: true }]);
            console.log(label, JSON.stringify(result, null, 2));
            if (!result.ok) throw new Error(`aidm-ui refuses ${label}`);
            const expected = ["linux-amd64-cpu", "linux-arm64-cpu", "linux-amd64-gpu"];
            if (nativeArchives) expected.push("windows-x64", "windows-x64-cuda");
            const missing = expected.filter((id) => !result.manifest.variants[id]);
            const unexpected = Object.keys(result.manifest.variants).filter((id) => !expected.includes(id));
            if (missing.length > 0 || unexpected.length > 0 || result.skippedVariants.length > 0) {
              throw new Error(`aidm-ui reads the wrong variants in ${label}: missing ${missing.join(", ") || "none"}, unexpected ${unexpected.join(", ") || "none"}, skipped ${result.skippedVariants.join(", ") || "none"}`);
            }
            if (nativeArchives) {
              const cpu = result.manifest.variants["windows-x64"];
              const cuda = result.manifest.variants["windows-x64-cuda"];
              if (cpu.kind !== "native" || cpu.gpu !== false || cpu.minimumDriverVersion !== undefined
                || cuda.kind !== "native" || cuda.gpu !== true || !/^\d+\.\d+$/.test(cuda.minimumDriverVersion ?? "")) {
                throw new Error(`aidm-ui reads the wrong native fields in ${label}`);
              }
            }
            console.log(`aidm-ui accepts ${label} with its ${expected.length} variants`);
          }
          const pem = readFileSync(resolve(process.env.RUNNER_TEMP, "dry-run-key.pem"), "utf8");
          for (const [name, nativeArchives] of [["containers", false], ["native", true]]) {
            const fixture = new Uint8Array(readFileSync(`tests/unit/fixtures/release-manifest-${name}.json`));
            await checkManifest(`${name} fixture`, fixture, await signBytes(fixture, pem), nativeArchives);
          }
          const bytes = new Uint8Array(readFileSync("manifest/manifest.json"));
          const signature = new Uint8Array(readFileSync("manifest/manifest.json.sig"));
          if (!["true", "false"].includes(process.env.NATIVE_ARCHIVES)) throw new Error("The native archive check has no result");
          await checkManifest("release manifest", bytes, signature, process.env.NATIVE_ARCHIVES === "true");
          EOF
          bun "$RUNNER_TEMP/check-manifest.ts"

  release:
    name: Draft release
    needs: [check, tag-images, sign-manifest, executables-test, native-packages, native-packages-test]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.check.result == 'success'
      && needs.tag-images.result == 'success'
      && needs.sign-manifest.result == 'success'
      && needs.executables-test.result == 'success'
      && ((needs.native-packages.result == 'success' && needs.check.outputs.native-archives == 'true')
        || (needs.native-packages.result == 'skipped' && needs.check.outputs.native-archives == 'false'))
      && ((needs.native-packages-test.result == 'success' && needs.check.outputs.native-archives == 'true')
        || (needs.native-packages-test.result == 'skipped' && needs.check.outputs.native-archives == 'false'))
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: executables
          path: dist

      - name: Download native packages
        if: needs.check.outputs.native-archives == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-packages
          path: native

      - name: Download native package descriptions
        if: needs.check.outputs.native-archives == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-descriptions
          path: native-descriptions

      - name: Combine native and executable checksums
        if: needs.check.outputs.native-archives == 'true'
        run: |
          cp native/*.tar.gz dist/
          cat native/SHA256SUMS >> dist/SHA256SUMS
          cd dist
          sha256sum -c SHA256SUMS

      # Signed and verified by sign-manifest
      - name: Download signed manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest-signed
          path: manifest

      # Creates or updates a draft. A published release is never touched.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          CPU_DIGEST: ${{ needs.tag-images.outputs.cpu-digest }}
          GPU_DIGEST: ${{ needs.tag-images.outputs.gpu-digest }}
          ENGINE_VERSION: ${{ needs.check.outputs.engine-version }}
          NATIVE_ARCHIVES: ${{ needs.check.outputs.native-archives }}
        run: |
          tag="$GITHUB_REF_NAME"
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changelog.md
          if ! grep -q '[^[:space:]]' changelog.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi

          {
            cat changelog.md
            echo
            echo "### Images"
            echo
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo "docker pull $IMAGE:$VERSION-gpu"
            echo '```'
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| \`$IMAGE:$VERSION\` (amd64, arm64) | \`$CPU_DIGEST\` |"
            echo "| \`$IMAGE:$VERSION-gpu\` (amd64) | \`$GPU_DIGEST\` |"
            echo
            echo "### Executables"
            echo
            echo "One executable per platform, with the files it needs. Check the downloads with \`SHA256SUMS\`."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            if [ "$NATIVE_ARCHIVES" = "true" ]; then
              echo
              echo "### Native packages"
              echo
              echo "Windows packages with AIDM engine $ENGINE_VERSION. Check the downloads with \`SHA256SUMS\`."
              echo
              echo "| Package | Size (bytes) | SHA-256 |"
              echo "| --- | --- | --- |"
              for variant in windows-x64 windows-x64-cuda; do
                jq -r '"| `\(.name)` | \(.size) | `\(.sha256)` |"' \
                  "native-descriptions/aidm-native-$VERSION-$variant.json"
              done
            fi
          } > notes.md

          if is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $tag is already published. Not changing it."
              exit 1
            fi
            gh release edit "$tag" --draft --notes-file notes.md
          else
            gh release create "$tag" --draft --verify-tag --title "AIDM API $VERSION" --notes-file notes.md
          fi

          # Only reached for a draft
          assets=(dist/aidm-api-* dist/SHA256SUMS manifest/manifest.json manifest/manifest.json.sig)
          if [ "$NATIVE_ARCHIVES" = "true" ]; then
            assets+=(dist/aidm-native-*.tar.gz)
          fi
          gh release upload "$tag" "${assets[@]}" --clobber
